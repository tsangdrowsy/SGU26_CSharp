# SQL Server + Web cho đồ án CoffeeShop — đặt thư mục docker/ này trong DoAn/ (cạnh WebApplication1/)
# Chạy:   docker compose --env-file .env up -d --build
# Web:    http://localhost:5144
# Xem log khởi tạo:  docker compose logs -f db-init
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: coffeeshop-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
      # Giờ Việt Nam: trigger ghi sổ kho bằng SYSDATETIME() (giờ của SQL Server), còn app ghi
      # OrderDate/CompletedAt bằng DateTime.Now (giờ máy). Container mặc định UTC -> lệch 7 tiếng,
      # báo cáo tồn kho theo ngày sẽ sai quanh nửa đêm.
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Chạy một lần: tạo CoffeeShopDb nếu chưa có (01 -> 02 -> 04_*). Đã có thì bỏ qua, không xoá dữ liệu.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ../WebApplication1/DB:/scripts:ro
      - ./init-db.sh:/init-db.sh:ro
    entrypoint: ["/bin/bash", "/init-db.sh"]
    restart: "no"

  # Web ASP.NET Core, build từ WebApplication1/Dockerfile
  web:
    build:
      context: ../WebApplication1
    image: coffeeshop-web
    container_name: coffeeshop-web
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully   # chờ tạo xong DB mới chạy Web
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Asia/Ho_Chi_Minh
      # "db" là tên service ở trên: trong mạng của compose, các container gọi nhau bằng tên service
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=CoffeeShopDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      # Khóa VNPay lấy từ file .env (không commit). Để trống thì chỉ dùng được COD.
      VnPay__TmnCode: ${VNPAY_TMN_CODE:-}
      VnPay__HashSecret: ${VNPAY_HASH_SECRET:-}
      DataProtection__KeysPath: /app/keys
    ports:
      - "5144:8080"   # cùng cổng với "dotnet run" -> ngrok / IPN VNPay giữ nguyên cấu hình
    volumes:
      - web-keys:/app/keys
      # Ảnh sản phẩm: dùng thẳng thư mục trên máy, để ảnh App WinUI vừa thêm hiện ngay trên Web
      - ../WebApplication1/wwwroot/img/sanpham:/app/wwwroot/img/sanpham:ro
    restart: unless-stopped

volumes:
  mssql-data:
  web-keys:
