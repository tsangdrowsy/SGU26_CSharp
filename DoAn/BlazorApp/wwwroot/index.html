<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thế Giới Cà Phê - Cà Phê Thế Giới</title>
    <meta name="description" content="Trang Thương Mại Điện Tử chính thức thuộc Tập Đoàn Trung Nguyên Legend cung cấp các sản phẩm Cà phê và Máy pha cà phê chất lượng." />
    <link rel="icon" type="image/x-icon" href="https://cafe.net.vn/media/favicon/stores/1/favicon-new.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['MinionPro', 'TrajanPro3', 'Times New Roman', 'Times', 'serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Custom animations */
        @@keyframes bounce-in {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            100% { opacity: 1; transform: translate(-50%, 0); }
        }
        .animate-bounce-in { animation: bounce-in 0.3s ease-out; }

        @@keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeInUp 0.25s ease-out; }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Scrollbar styling for cart drawer */
        .overflow-y-auto::-webkit-scrollbar { width: 6px; }
        .overflow-y-auto::-webkit-scrollbar-track { background: transparent; }
        .overflow-y-auto::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 3px; }
        .overflow-y-auto::-webkit-scrollbar-thumb:hover { background: #a3a3a3; }
    </style>
</head>
<body class="bg-neutral-50 antialiased">
    <div id="app">
        <div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
                <div class="w-10 h-10 border-4 border-amber-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-neutral-500 text-sm">Đang tải...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden fixed bottom-0 left-0 right-0 bg-red-600 text-white text-sm px-5 py-3 z-50">
        Đã xảy ra lỗi. <a href="" class="underline font-semibold">Tải lại trang</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
